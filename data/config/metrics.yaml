# Metric registry (spec Sections 5, 6, 10 and 11).
#
# Fields
#   label          plain-English name shown on the site
#   unit           pct | pts | usd | count | millions | thousands | index | months | days | usd_bn | ratio
#   decimals       digits after the decimal point for the default display
#   polarity       higher_is_good | lower_is_good | mixed   (Section 5.3; mixed always renders black)
#   flat_threshold change smaller than this is "flat" (Section 5.2).
#                  Omit to use the default: 0.05 points for pct/pts units, 1% relative otherwise.
#                  Write as {relative: 0.002} or {points: 0.05}.
#   automation     AUTO (API) | SEMI (scripted download/parse) | MANUAL (owner enters monthly)
#   frequency      daily | weekly | monthly | quarterly | annual | snapshot
#   max_age_days   validator warns when the as-of date is older than this (Section 11.3)
#   fred           FRED series id(s) when AUTO via FRED
#   required       build fails if a MANUAL value is still stale (Section 11.2)
#   source_name / source_url   default source; an edition can override per value

defaults:
  max_age_days: { daily: 7, weekly: 14, monthly: 45, quarterly: 120, annual: 400, snapshot: 45 }

metrics:
  # ---------------------------------------------------------------- Labor
  unemployment:
    label: Unemployment rate
    unit: pct
    decimals: 1
    polarity: lower_is_good
    automation: AUTO
    frequency: monthly
    fred: UNRATE
    source_name: BLS via FRED
    source_url: https://fred.stlouisfed.org/series/UNRATE
    required: true
  initial_claims:
    label: New jobless claims (weekly)
    unit: count
    polarity: lower_is_good
    automation: AUTO
    frequency: weekly
    fred: ICSA
    source_name: DOL via FRED
    source_url: https://www.dol.gov/ui/data.pdf
  continuing_claims:
    label: Continuing claims
    unit: millions
    decimals: 3
    polarity: lower_is_good
    automation: AUTO
    frequency: weekly
    fred: CCSA
    source_name: DOL via FRED
    source_url: https://fred.stlouisfed.org/series/CCSA
  job_openings:
    label: Job openings
    unit: millions
    decimals: 1
    polarity: higher_is_good
    automation: AUTO
    frequency: monthly
    fred: JTSJOL
    source_name: BLS JOLTS via FRED
    source_url: https://fred.stlouisfed.org/series/JTSJOL
    max_age_days: 60  # JOLTS is released about 5-6 weeks after the month
  payrolls_change:
    label: Jobs added (nonfarm payrolls)
    unit: count
    polarity: higher_is_good
    automation: AUTO
    frequency: monthly
    source_name: BLS jobs report
    source_url: https://www.bls.gov/news.release/empsit.nr0.htm
  avg_weeks_unemployed:
    label: Average job search (weeks)
    unit: count
    decimals: 1
    polarity: lower_is_good
    automation: AUTO
    frequency: monthly
    fred: UEMPMEAN
    source_name: BLS via FRED
    source_url: https://www.bls.gov/news.release/empsit.nr0.htm
  recent_grad_unemployment:
    label: Recent-graduate unemployment
    unit: pct
    decimals: 1
    polarity: lower_is_good
    automation: MANUAL
    frequency: quarterly
    source_name: NY Fed College Labor Market
    source_url: https://www.newyorkfed.org/research/college-labor-market
    max_age_days: 160

